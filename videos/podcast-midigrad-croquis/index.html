<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>MIDIGRAD Podcast — croquis</title>
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 400; src: url("assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("assets/fonts/poppins-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      :root { --ink: #14162b; --royal: #2e3192; --sky: #23bded; --skyd: #1688c4; --red: #e1251b; --gold: #f7941d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: #05060f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Poppins", sans-serif; color: #fff;
        background: radial-gradient(80% 70% at 30% 30%, #1c1f55 0%, #0d0f2c 50%, #05060f 100%); }
      .blob { position: absolute; border-radius: 50%; }
      .b1 { left: -200px; top: -150px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(35,189,237,.18), rgba(35,189,237,0) 65%); }
      .b2 { right: -260px; bottom: -200px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(122,77,255,.20), rgba(122,77,255,0) 65%); }

      /* Marque (logo + MIDIGRAD dans l'eau) */
      #brand { position: absolute; left: 870px; top: 46px; width: 530px; height: 150px; }
      #brand .lg { position: absolute; left: 0; top: 14px; width: 112px; height: 112px; border-radius: 50%; background: url("assets/logo-badge.png") center/cover; box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 40px rgba(35,189,237,.5); }
      #brand svg { position: absolute; left: 128px; top: 0; width: 400px; height: 150px; overflow: visible; }
      #brand .tag { position: absolute; left: 136px; top: 112px; font: 600 18px "Montserrat"; letter-spacing: .5em; color: var(--sky); }

      /* Platine */
      #deck { position: absolute; left: 870px; top: 220px; width: 530px; height: 600px; border-radius: 36px;
        background: linear-gradient(160deg, #2b2e45 0%, #171929 55%, #10111c 100%); box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.06); }
      #deck::after { content: ""; position: absolute; inset: 0; border-radius: 36px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 5px); pointer-events: none; }
      .plat { position: absolute; left: 40px; top: 46px; width: 400px; height: 400px; border-radius: 50%; background: #0b0c12; box-shadow: 0 0 0 10px #22253a, 0 0 0 12px #3a3e5a, 0 20px 50px rgba(0,0,0,.7); }
      .strobe { position: absolute; inset: -10px; border-radius: 50%; background: repeating-conic-gradient(#8d93b8 0 1.2deg, transparent 1.2deg 6deg); -webkit-mask-image: radial-gradient(circle, transparent 0 196px, #000 197px 205px, transparent 206px); mask-image: radial-gradient(circle, transparent 0 196px, #000 197px 205px, transparent 206px); }
      #vinyl { position: absolute; inset: 8px; border-radius: 50%;
        background: radial-gradient(circle, transparent 0 62px, #111 63px), repeating-radial-gradient(circle, #141418 0 2px, #0a0a0d 2px 4px); }
      #vinyl .label { position: absolute; left: 50%; top: 50%; width: 128px; height: 128px; margin: -64px; border-radius: 50%; background: url("assets/logo-badge.png") center/cover; box-shadow: 0 0 0 4px #e1251b; }
      #vinyl .label::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: #ccc; box-shadow: 0 0 0 3px #555; }
      #vinyl .mark { position: absolute; left: 50%; top: 24px; width: 6px; height: 40px; margin-left: -3px; border-radius: 3px; background: rgba(35,189,237,.6); }
      .shine { position: absolute; inset: 8px; border-radius: 50%; background: conic-gradient(from 30deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.14) 25deg, rgba(255,255,255,0) 60deg, rgba(255,255,255,0) 180deg, rgba(255,255,255,.10) 210deg, rgba(255,255,255,0) 245deg); pointer-events: none; }
      #arm { position: absolute; left: 418px; top: 40px; width: 60px; height: 380px; transform-origin: 30px 30px; }
      #arm .pivot { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #d8dbe6, #7d8197); box-shadow: 0 6px 16px rgba(0,0,0,.6); }
      #arm .rod { position: absolute; left: 25px; top: 30px; width: 10px; height: 300px; border-radius: 5px; background: linear-gradient(90deg, #9da1b5, #eef0f6, #9da1b5); }
      #arm .head { position: absolute; left: 12px; top: 318px; width: 36px; height: 56px; border-radius: 8px; background: linear-gradient(#e1251b, #a3150e); transform: rotate(18deg); }
      .vu { position: absolute; left: 40px; bottom: 44px; display: flex; gap: 8px; align-items: flex-end; height: 70px; }
      .vu i { display: block; width: 18px; height: 70px; border-radius: 4px; background: linear-gradient(to top, #23bded 0%, #23bded 55%, #f7941d 80%, #e1251b 100%); transform-origin: 50% 100%; }
      .knob { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5c6080, #23263a); box-shadow: 0 6px 14px rgba(0,0,0,.5); }
      .knob::after { content: ""; position: absolute; left: 25px; top: 6px; width: 4px; height: 16px; border-radius: 2px; background: var(--sky); }
      .rpm { position: absolute; right: 40px; bottom: 120px; font: 800 26px "Montserrat"; color: #23bded; text-shadow: 0 0 12px #23bded; letter-spacing: .1em; }
      .led { position: absolute; right: 44px; bottom: 54px; width: 14px; height: 14px; border-radius: 50%; background: #e1251b; box-shadow: 0 0 12px #e1251b; }

      /* Panneau d'illustrations */
      #panel { position: absolute; left: 40px; top: 46px; width: 790px; height: 774px; border-radius: 36px; overflow: hidden;
        background: radial-gradient(90% 90% at 40% 30%, #ffffff 0%, #eef1f7 60%, #e2e7f0 100%); box-shadow: 0 40px 90px rgba(0,0,0,.5); color: var(--ink); }
      .scn { position: absolute; inset: 0; padding: 120px 64px; opacity: 0; }
      .kick { font: 600 20px "Montserrat"; letter-spacing: .3em; color: var(--skyd); }
      .ttl { margin-top: 18px; font: 800 78px/1.05 "Montserrat"; letter-spacing: -.02em; }
      .sub { margin-top: 22px; font: 400 34px/1.45 "Poppins"; color: #5a6078; }
      .ico { width: 150px; height: 150px; border-radius: 40px; display: grid; place-items: center; background: linear-gradient(160deg, #3fc9f2, #1688c4); box-shadow: 0 24px 60px rgba(22,136,196,.35); }
      .ico svg { width: 84px; height: 84px; }
      .chip { display: inline-block; margin: 0 14px 16px 0; padding: 16px 28px; border-radius: 40px; font: 800 32px "Montserrat"; background: var(--ink); color: #fff; opacity: 0; }
      .chip.a { background: var(--sky); color: #04253d; }
      .night { position: absolute; inset: 0; background: radial-gradient(90% 80% at 50% 100%, #2b2f7a, #141640 50%, #070820); }
      .star { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; }
      .big { font: 800 250px/1 "Montserrat"; letter-spacing: -.05em; color: var(--ink); }
      .big small { font-size: 70px; color: var(--skyd); letter-spacing: 0; }
      .verse { margin-top: 30px; font: 400 42px/1.5 "Poppins"; color: #4a5070; }
      .verse b { font-weight: 600; color: var(--ink); background-image: linear-gradient(transparent 60%, rgba(35,189,237,.4) 60%); background-repeat: no-repeat; background-size: var(--hl, 0%) 100%; }
      .sec { position: absolute; left: 64px; bottom: 50px; display: flex; gap: 10px; }
      .sec i { width: 46px; height: 6px; border-radius: 3px; background: rgba(20,22,43,.15); }
      .sec i.on { background: var(--sky); }

      /* Paroles */
      #lyrics { position: absolute; left: 40px; right: 40px; top: 850px; height: 190px; }
      .ly { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 600 46px/1.32 "Poppins"; opacity: 0; padding: 0 30px; }
      .ly .w { color: rgba(255,255,255,.38); }
      .ly .w.on { color: #fff; }
      .ly .w.k.on { color: #7fdcff; }
      .lyr-tag { position: absolute; left: 50%; top: 822px; transform: translateX(-50%); font: 600 15px "Montserrat"; letter-spacing: .5em; color: rgba(255,255,255,.4); }

      /* Intro */
      #intro { position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 45%, #1d2160 0%, #0a0c26 60%, #05060f 100%); display: grid; place-items: center; }
      .ring { position: absolute; left: 50%; top: 44%; width: 300px; height: 300px; margin: -150px; border-radius: 50%; border: 3px solid rgba(35,189,237,.7); opacity: 0; }
      #ilg { position: absolute; left: 50%; top: 44%; width: 300px; height: 300px; margin: -150px; border-radius: 50%; background: url("assets/logo-badge.png") center/cover; box-shadow: 0 0 0 8px #fff, 0 0 90px rgba(35,189,237,.6); }
      #itx { position: absolute; left: 0; right: 0; top: 690px; text-align: center; }
      #itx .t1 { font: 800 70px "Montserrat"; letter-spacing: .35em; padding-left: .35em; }
      #itx .t2 { margin-top: 10px; font: 500 28px "Poppins"; color: rgba(255,255,255,.75); }
      #itx .t1 b { color: var(--sky); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="64" data-width="1440" data-height="1080">
      <div class="blob b1"></div><div class="blob b2"></div>
      <div id="panel"></div>
      <div id="brand">
        <span class="lg"></span>
        <svg viewBox="0 0 400 150">
          <defs>
            <filter id="water" x="-10%" y="-30%" width="120%" height="160%">
              <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="4" result="n" />
              <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#7fdcff" /></linearGradient>
            <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23bded" stop-opacity=".45" /><stop offset="1" stop-color="#23bded" stop-opacity="0" /></linearGradient>
          </defs>
          <g filter="url(#water)">
            <text id="wtext" x="4" y="84" font-family="Montserrat" font-weight="800" font-size="60" letter-spacing="1" fill="url(#wg)"></text>
          </g>
        </svg>
        <div class="tag">PODCAST · MÉDITATION</div>
      </div>
      <div id="deck">
        <div class="plat"><div class="strobe"></div><div id="vinyl"><span class="mark"></span><span class="label"></span></div><div class="shine"></div></div>
        <div id="arm"><span class="rod"></span><span class="head"></span><span class="pivot"></span></div>
        <div class="vu" id="vu"></div>
        <div class="knob" style="right:40px;bottom:180px"></div><div class="knob" style="right:110px;bottom:180px"></div>
        <div class="rpm">33 RPM</div><div class="led"></div>
      </div>
      <div class="lyr-tag">PAROLES</div>
      <div id="lyrics"></div>
      <div id="intro"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span id="ilg"></span>
        <div id="itx"><div class="t1"><b>MIDIGRAD</b> PODCAST</div><div class="t2">Méditation de l'Apôtre Paris Talla</div></div></div>

      <audio id="voix" src="assets/voix.wav" data-start="0" data-duration="64" data-track-index="2" data-volume="1"></audio>
      <audio id="vinyle" src="assets/sfx/vinyle.wav" data-start="3.4" data-duration="60.6" data-track-index="3" data-volume="0.35"></audio>
      <audio id="s-intro-1" src="assets/sfx/impact.wav" data-start="0.3" data-duration="1.8" data-track-index="4" data-volume="0.4"></audio>
      <audio id="s-intro-2" src="assets/sfx/scintillement.wav" data-start="0.9" data-duration="3.2" data-track-index="5" data-volume="0.3"></audio>
      <audio id="s-w1" src="assets/sfx/whoosh.wav" data-start="3.3" data-duration="0.9" data-track-index="6" data-volume="0.3"></audio>
      <audio id="s-w2" src="assets/sfx/whoosh.wav" data-start="18.4" data-duration="0.9" data-track-index="6" data-volume="0.3"></audio>
      <audio id="s-w3" src="assets/sfx/whoosh.wav" data-start="33.4" data-duration="0.9" data-track-index="6" data-volume="0.3"></audio>
      <audio id="s-w4" src="assets/sfx/whoosh.wav" data-start="48.4" data-duration="0.9" data-track-index="6" data-volume="0.3"></audio>
      <audio id="s-c1" src="assets/sfx/scintillement.wav" data-start="30.5" data-duration="3.2" data-track-index="5" data-volume="0.22"></audio>
      <audio id="s-c2" src="assets/sfx/montee.wav" data-start="40.2" data-duration="2.5" data-track-index="7" data-volume="0.2"></audio>
      <audio id="s-c3" src="assets/sfx/impact.wav" data-start="42.5" data-duration="1.8" data-track-index="4" data-volume="0.28"></audio>
      <audio id="s-c4" src="assets/sfx/page.wav" data-start="48.7" data-duration="0.35" data-track-index="8" data-volume="0.35"></audio>
    </div>
    <script src="assets/env.js"></script>
    <script src="assets/caps.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const mk = (p, h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); const e = d.firstChild; p.appendChild(e); return e; };
        const bin = (e, t, o = {}) => tl.fromTo(e, { opacity: 0, y: o.y ?? 30, scale: o.s ?? 1, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: o.e ?? "power3.out" }, t);

        // MIDIGRAD « dans l'eau » : lettres qui flottent + filtre d'ondulation
        const W = "MIDIGRAD", wt = $("#wtext");
        [...W].forEach((c, i) => { for (const el of [wt]) { const s = document.createElementNS("http://www.w3.org/2000/svg", "tspan"); s.textContent = c; s.setAttribute("class", "ch" + i); el.appendChild(s); } });
        const chT = [...wt.querySelectorAll("tspan")], turb = $("#turb");

        // Platine
        const vu = $("#vu"); for (let i = 0; i < 12; i++) mk(vu, "<i></i>");
        const bars = [...vu.children], vinyl = $("#vinyl"), arm = $("#arm");
        const env = (t) => { const f = Math.max(0, Math.min(window.ENV.length - 1, Math.round(t * 30))); return window.ENV[f] || 0; };

        function frame(t) {
          const play = Math.max(0, t - 3.4);
          const spin = t < 3.4 ? 0 : Math.min(play, 1.2) ** 2 / 2.4 * 200 + Math.max(0, play - 1.2) * 200;
          vinyl.style.transform = `rotate(${spin}deg)`;
          const armA = t < 2.6 ? -28 : t < 3.4 ? -28 + (t - 2.6) / 0.8 * 24 : -4 + Math.min(1, play / 60) * 8 + Math.sin(t * 7) * 0.15;
          arm.style.transform = `rotate(${armA}deg)`;
          const e = env(t);
          bars.forEach((b, i) => { const k = Math.max(0.04, Math.min(1, e * (1.15 - Math.abs(i - 5.5) / 9) + 0.12 * Math.sin(t * 11 + i * 1.7) * e)); b.style.transform = `scaleY(${k})`; });
          turb.setAttribute("baseFrequency", `${(0.010 + 0.003 * Math.sin(t * 0.9)).toFixed(4)} ${(0.05 + 0.02 * Math.sin(t * 1.3 + 1)).toFixed(4)}`);
          chT.forEach((c, i) => { const dy = Math.sin(t * 2.2 + i * 0.7) * 5; c.setAttribute("dy", i ? (dy - (Math.sin(t * 2.2 + (i - 1) * 0.7) * 5)).toFixed(2) : dy.toFixed(2)); });
        }
        const drv = {}; let tN = 0;
        Object.defineProperty(drv, "t", { get: () => tN, set: (v) => { tN = v; frame(v); } });
        tl.fromTo(drv, { t: 0 }, { t: 64, duration: 64, ease: "none" }, 0);
        frame(0);

        // Intro : le logo tombe dans l'eau
        tl.fromTo("#ilg", { scale: 0.3, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(1.6)" }, 0.3);
        document.querySelectorAll("#intro .ring").forEach((r, i) => tl.fromTo(r, { scale: 0.9, opacity: 0.9 }, { scale: 2.6 + i * 0.5, opacity: 0, duration: 2.2, ease: "power2.out" }, 0.5 + i * 0.35));
        bin($("#itx .t1"), 1.1); bin($("#itx .t2"), 1.4);
        tl.to("#intro", { opacity: 0, scale: 1.06, filter: "blur(14px)", duration: 0.6, ease: "power2.in" }, 3.0);
        tl.fromTo("#brand", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 3.4);
        tl.fromTo("#deck", { opacity: 0, y: 60, rotation: 2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "power3.out" }, 3.3);
        tl.fromTo("#panel", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 3.3);

        // Illustrations : une nouvelle scène toutes les 15 s
        const P = $("#panel"), SEG = [3.6, 18.6, 33.6, 48.6, 64];
        const ICON = {
          sun: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="24" r="8"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M10 38l4-4M34 14l4-4"/></svg>',
          ear: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M14 20a11 11 0 0 1 22 0c0 6-5 8-6 12s-3 8-8 8-6-4-6-6"/><path d="M20 20a5 5 0 0 1 10 0c0 3-3 4-3 6"/></svg>',
          eye: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.5"><path d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24z"/><circle cx="24" cy="24" r="6"/></svg>',
        };
        const scene = (k, build) => {
          const el = mk(P, `<div class="scn"></div>`), a = SEG[k], b = SEG[k + 1];
          mk(el, `<div class="sec">${SEG.slice(0, 4).map((_, j) => `<i class="${j === k ? "on" : ""}"></i>`).join("")}</div>`);
          tl.fromTo(el, { opacity: 0, scale: 1.04, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, a);
          if (k < 3) tl.to(el, { opacity: 0, scale: 0.97, filter: "blur(18px)", duration: 0.45, ease: "power2.in" }, b - 0.45);
          build(el, a);
        };
        scene(0, (el, a) => {
          const g1 = mk(el, `<div><div class="ico">${ICON.ear}</div><div class="kick" style="margin-top:40px">2 TIMOTHÉE 4 : 3</div><div class="ttl">Les derniers temps</div><div class="sub">Des choses agréables à entendre…</div></div>`);
          [...g1.children].forEach((c, i) => bin(c, a + 0.3 + i * 0.15));
          tl.to(g1, { opacity: 0, y: -30, filter: "blur(12px)", duration: 0.4 }, 9.6);
          const g2 = mk(el, `<div style="position:absolute;left:64px;top:120px;right:64px"><div class="ico" style="background:linear-gradient(160deg,#ffc04d,#f7941d)">${ICON.sun}</div><div class="kick" style="margin-top:40px">CE MATIN</div><div class="ttl">Une bonne nouvelle</div><div class="sub">« Je ne viens pas t'annoncer cela. »</div></div>`);
          [...g2.children].forEach((c, i) => bin(c, 10.0 + i * 0.15));
        });
        scene(1, (el, a) => {
          const n = mk(el, `<div class="night"></div>`);
          let s = 11; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
          for (let i = 0; i < 110; i++) { const st = mk(n, `<i class="star" style="left:${r() * 790}px;top:${r() * 560}px;width:${2 + r() * 4}px;height:${2 + r() * 4}px"></i>`); const t0 = a + 0.4 + r() * 8; tl.fromTo(st, { opacity: 0 }, { opacity: 0.4 + r() * 0.6, duration: 0.6 }, t0); tl.to(st, { opacity: 0.2, duration: 1 + r(), yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 0.7); }
          const tx = mk(el, `<div style="position:absolute;left:64px;right:64px;top:120px;color:#fff"><div class="kick" style="color:#7fdcff">ROMAINS 4 : 18</div><div class="ttl">Espérant contre toute espérance</div></div>`);
          [...tx.children].forEach((c, i) => bin(c, a + 0.4 + i * 0.15));
          const t2 = mk(el, `<div style="position:absolute;left:0;right:0;bottom:120px;text-align:center;font:800 54px Montserrat;color:#fff;text-shadow:0 0 30px rgba(127,220,255,.7)">Telle sera ta postérité.</div>`); bin(t2, 30.5);
        });
        scene(2, (el, a) => {
          const b = mk(el, `<div><div class="kick">SANS FAIBLIR DANS LA FOI</div><div class="big" style="margin-top:30px">0<small> ans</small></div></div>`);
          [...b.children].forEach((c, i) => bin(c, a + 0.3 + i * 0.15));
          const num = b.querySelector(".big").firstChild; const o = {}; let v = 0;
          Object.defineProperty(o, "n", { get: () => v, set: (x) => { v = x; num.nodeValue = String(Math.round(x)); } });
          tl.fromTo(o, { n: 0 }, { n: 100, duration: 2.2, ease: "power2.out" }, 40.2);
          const c = mk(el, `<div style="position:absolute;left:64px;right:64px;top:470px"></div>`);
          [["Corps usé", 35.6, ""], ["Près de cent ans", 40.3, "a"], ["Sara", 42.9, ""], ["Il ne douta point", 46.9, "a"]].forEach(([txt, t, k]) => { const x = mk(c, `<span class="chip ${k}">${txt}</span>`); bin(x, t, { s: 0.8, y: 20, e: "back.out(1.8)" }); });
        });
        scene(3, (el, a) => {
          const v = mk(el, `<div><div class="kick">ROMAINS 4 : 20 · LOUIS SEGOND</div><div class="verse">Il ne douta point, par incrédulité, au sujet de la promesse de Dieu ; <b>mais il fut fortifié par la foi, donnant gloire à Dieu</b>.</div></div>`);
          [...v.children].forEach((c, i) => bin(c, a + 0.3 + i * 0.15));
          tl.fromTo(v.querySelector("b"), { "--hl": "0%" }, { "--hl": "100%", duration: 1.4, ease: "power2.inOut" }, 50.6);
          tl.to(v, { opacity: 0, y: -30, filter: "blur(12px)", duration: 0.4 }, 54.3);
          const g = mk(el, `<div style="position:absolute;left:64px;top:120px;right:64px"><div class="ico">${ICON.eye}</div><div class="kick" style="margin-top:40px">BIEN-AIMÉ</div><div class="ttl">Ce que tu vois autour de toi</div><div class="sub">Santé · foyer · affaires · enfants · projets</div></div>`);
          [...g.children].forEach((c, i) => bin(c, 54.6 + i * 0.15));
        });

        // Paroles mot à mot
        const LY = $("#lyrics"), KEY = /^(promesse|Dieu|foi|Bible|bien-aimés?|espérance|postérité|Romains)/i;
        window.CAPS.forEach(([a, b, txt]) => {
          const words = txt.split(" ");
          const el = mk(LY, `<div class="ly">${words.map((w) => `<span class="w${KEY.test(w.replace(/^[«(—]+/, "")) ? " k" : ""}">${w}</span>`).join(" ")}</div>`);
          tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, a - 0.05);
          tl.to(el, { opacity: 0, y: -10, duration: 0.18 }, Math.max(a + 0.3, b - 0.05));
          const L = words.reduce((s, w) => s + w.length + 1, 0); let cur = a;
          el.querySelectorAll(".w").forEach((w, i) => { tl.set(w, { color: w.classList.contains("k") ? "#7fdcff" : "#ffffff" }, cur); cur += (b - a) * (words[i].length + 1) / L * 0.92; });
        });
        tl.fromTo(".lyr-tag", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.6);
        window.__timelines["main"] = tl;
      })();
    </script>
