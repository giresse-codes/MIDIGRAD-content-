        [...W].forEach((c, i) => { for (const el of [wt]) { const s = document.createElementNS("http://www.w3.org/2000/svg", "tspan"); s.textContent = c; s.setAttribute("class", "ch" + i); el.appendChild(s); } });
        const chT = [...wt.querySelectorAll("tspan")], turb = $("#turb");

        // Platine
        const vu = $("#vu"); for (let i = 0; i < 12; i++) mk(vu, "<i></i>");
        const bars = [...vu.children], vinyl = $("#vinyl"), arm = $("#arm");
        const env = (t) => { const f = Math.max(0, Math.min(window.ENV.length - 1, Math.round(t * 30))); return window.ENV[f] || 0; };

        function frame(t) {
          const play = Math.max(0, t - 3.4);
          const spin = t < 3.4 ? 0 : Math.min(play, 1.2) ** 2 / 2.4 * 200 + Math.max(0, play - 1.2) * 200;
          vinyl.style.transform = `rotate(${spin}deg)`;
          const armA = t < 2.6 ? -28 : t < 3.4 ? -28 + (t - 2.6) / 0.8 * 24 : -4 + Math.min(1, play / (window.EP.DUR - 4)) * 8 + Math.sin(t * 7) * 0.15;
          arm.style.transform = `rotate(${armA}deg)`;
          const e = env(t);
          bars.forEach((b, i) => { const k = Math.max(0.04, Math.min(1, e * (1.15 - Math.abs(i - 5.5) / 9) + 0.12 * Math.sin(t * 11 + i * 1.7) * e)); b.style.transform = `scaleY(${k})`; });
          turb.setAttribute("baseFrequency", `${(0.010 + 0.003 * Math.sin(t * 0.9)).toFixed(4)} ${(0.05 + 0.02 * Math.sin(t * 1.3 + 1)).toFixed(4)}`);
          chT.forEach((c, i) => { const dy = Math.sin(t * 2.2 + i * 0.7) * 5; c.setAttribute("dy", i ? (dy - (Math.sin(t * 2.2 + (i - 1) * 0.7) * 5)).toFixed(2) : dy.toFixed(2)); });
        }
        const drv = {}; let tN = 0;
        Object.defineProperty(drv, "t", { get: () => tN, set: (v) => { tN = v; frame(v); } });
        tl.fromTo(drv, { t: 0 }, { t: window.EP.DUR, duration: window.EP.DUR, ease: "none" }, 0);
        frame(0);

        // Intro : le logo tombe dans l'eau
        tl.fromTo("#ilg", { scale: 0.3, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(1.6)" }, 0.3);
        document.querySelectorAll("#intro .ring").forEach((r, i) => tl.fromTo(r, { scale: 0.9, opacity: 0.9 }, { scale: 2.6 + i * 0.5, opacity: 0, duration: 2.2, ease: "power2.out" }, 0.5 + i * 0.35));
        bin($("#itx .t1"), 1.1); bin($("#itx .t2"), 1.4);
        tl.to("#intro", { opacity: 0, scale: 1.06, filter: "blur(14px)", duration: 0.6, ease: "power2.in" }, 3.0);
        tl.fromTo("#brand", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 3.4);
        tl.fromTo("#deck", { opacity: 0, y: 60, rotation: 2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "power3.out" }, 3.3);
        tl.fromTo("#panel", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 3.3);

        // Illustrations : une nouvelle scène toutes les 15 s (données dans assets/episode.js)
        const EP = window.EP, P = $("#panel"), SFX = [];
        const sfx = (t, n, v) => SFX.push([+t.toFixed(2), n, v]);
        const sw = 'fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"';
        const ICON = {
          sun: `<svg viewBox="0 0 48 48" ${sw}><circle cx="24" cy="24" r="8"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M10 38l4-4M34 14l4-4"/></svg>`,
          ear: `<svg viewBox="0 0 48 48" ${sw}><path d="M14 20a11 11 0 0 1 22 0c0 6-5 8-6 12s-3 8-8 8-6-4-6-6"/><path d="M20 20a5 5 0 0 1 10 0c0 3-3 4-3 6"/></svg>`,
          eye: `<svg viewBox="0 0 48 48" ${sw}><path d="M4 24s7-12 20-12 20 12 20 12-7 12-20 12S4 24 4 24z"/><circle cx="24" cy="24" r="6"/></svg>`,
          heart: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 41S6 30 6 17a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 13-18 24-18 24z"/></svg>`,
          cross: `<svg viewBox="0 0 48 48" fill="#fff"><rect x="20" y="4" width="8" height="40" rx="3"/><rect x="9" y="14" width="30" height="8" rx="3"/></svg>`,
          book: `<svg viewBox="0 0 48 48" ${sw}><path d="M6 10h13a5 5 0 0 1 5 5v25a4 4 0 0 0-4-4H6z"/><path d="M42 10H29a5 5 0 0 0-5 5v25a4 4 0 0 1 4-4h14z"/></svg>`,
          hands: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 8v24M24 8c-3 2-7 8-8 14l-6 8 6 8h8M24 8c3 2 7 8 8 14l6 8-6 8h-8"/></svg>`,
          star: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 5l5.6 12 13 1.4-9.8 8.8 2.8 12.8L24 33.5 12.4 40l2.8-12.8L5.4 18.4l13-1.4z"/></svg>`,
          dove: `<svg viewBox="0 0 48 48" ${sw}><path d="M6 28c8 0 12-4 14-10 2 6 8 10 16 8l6-6-4 10c-4 8-12 10-20 8L8 40l4-8z"/><path d="M20 18c0-6 4-10 8-10"/></svg>`,
          house: `<svg viewBox="0 0 48 48" ${sw}><path d="M7 22L24 8l17 14"/><path d="M11 19v21h26V19"/><path d="M20 40V28h8v12"/></svg>`,
          clock: `<svg viewBox="0 0 48 48" ${sw}><circle cx="24" cy="24" r="18"/><path d="M24 13v11l7 5"/></svg>`,
          crown: `<svg viewBox="0 0 48 48" ${sw}><path d="M6 36l4-20 9 9 5-13 5 13 9-9 4 20z"/><path d="M6 40h36"/></svg>`,
          key: `<svg viewBox="0 0 48 48" ${sw}><circle cx="16" cy="24" r="8"/><path d="M24 24h18M36 24v8M42 24v6"/></svg>`,
          bulb: `<svg viewBox="0 0 48 48" ${sw}><path d="M17 30c-4-3-6-7-6-11a13 13 0 0 1 26 0c0 4-2 8-6 11v5H17z"/><path d="M19 41h10"/></svg>`,
          people: `<svg viewBox="0 0 48 48" ${sw}><circle cx="17" cy="16" r="6"/><circle cx="33" cy="18" r="5"/><path d="M5 40c0-8 5-13 12-13s12 5 12 13M29 40c0-6 3-10 8-10s7 4 7 10"/></svg>`,
          shield: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></svg>`,
          mountain: `<svg viewBox="0 0 48 48" ${sw}><path d="M4 40l14-24 8 12 5-7 13 19z"/></svg>`,
          water: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 6s-12 14-12 22a12 12 0 0 0 24 0C36 20 24 6 24 6z"/></svg>`,
          fire: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 44c-8 0-13-6-13-13 0-9 9-12 9-22 6 4 9 9 9 14 3-2 4-5 4-7 4 4 5 9 5 14 0 8-6 14-14 14z"/></svg>`,
          seed: `<svg viewBox="0 0 48 48" ${sw}><path d="M24 44V22M24 30c-10 0-14-8-14-16 10 0 14 6 14 16zM24 24c0-8 4-14 14-14 0 8-4 14-14 14z"/></svg>`,
          mic: `<svg viewBox="0 0 48 48" ${sw}><rect x="17" y="4" width="14" height="24" rx="7"/><path d="M10 22a14 14 0 0 0 28 0M24 36v8"/></svg>`,
          gift: `<svg viewBox="0 0 48 48" ${sw}><rect x="6" y="18" width="36" height="24" rx="3"/><path d="M4 12h40v6H4zM24 12v30M24 12c-4-8-14-6-10 0M24 12c4-8 14-6 10 0"/></svg>`,
          chain: `<svg viewBox="0 0 48 48" ${sw}><rect x="4" y="16" width="22" height="16" rx="8"/><rect x="22" y="16" width="22" height="16" rx="8"/></svg>`,
          road: `<svg viewBox="0 0 48 48" ${sw}><path d="M18 4L8 44M30 4l10 40M24 8v6M24 20v6M24 32v8"/></svg>`,
        };
        const GRAD = { a: "linear-gradient(160deg,#3fc9f2,#1688c4)", g: "linear-gradient(160deg,#ffc04d,#f7941d)", r: "linear-gradient(160deg,#ff6a5c,#e1251b)", b: "linear-gradient(160deg,#4a4fd0,#2e3192)" };
        const R = {
          icon: (box, p, t) => { const g = mk(box, `<div><div class="ico" style="background:${GRAD[p.c || "a"]}">${ICON[p.ic] || ICON.star}</div><div class="kick" style="margin-top:40px">${p.kick || ""}</div><div class="ttl">${p.title}</div>${p.sub ? `<div class="sub">${p.sub}</div>` : ""}</div>`); [...g.children].forEach((c, i) => bin(c, t + 0.3 + i * 0.15)); return g; },
          night: (box, p, t) => {
            const g = mk(box, `<div class="night"></div>`); let s = 11 + Math.round(t); const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
            for (let i = 0; i < 90; i++) { const st = mk(g, `<i class="star" style="left:${r() * 790}px;top:${r() * 600}px;width:${2 + r() * 4}px;height:${2 + r() * 4}px"></i>`); const t0 = t + 0.4 + r() * 6; tl.fromTo(st, { opacity: 0 }, { opacity: 0.4 + r() * 0.6, duration: 0.6 }, t0); tl.to(st, { opacity: 0.2, duration: 1 + r(), yoyo: true, repeat: 2, ease: "sine.inOut" }, t0 + 0.7); }
            const tx = mk(g, `<div style="position:absolute;left:64px;right:64px;top:120px;color:#fff"><div class="kick" style="color:#7fdcff">${p.kick || ""}</div><div class="ttl">${p.title}</div></div>`); [...tx.children].forEach((c, i) => bin(c, t + 0.4 + i * 0.15));
            if (p.line) { const l = mk(g, `<div style="position:absolute;left:40px;right:40px;bottom:120px;text-align:center;font:800 50px Montserrat;color:#fff;text-shadow:0 0 30px rgba(127,220,255,.7)">${p.line}</div>`); bin(l, t + (p.lineAt ?? 4)); sfx(t + (p.lineAt ?? 4), "scintillement", 0.22); }
            sfx(t + 0.3, "scintillement", 0.2); return g;
          },
          count: (box, p, t) => {
            const g = mk(box, `<div><div class="kick">${p.kick || ""}</div><div class="big" style="margin-top:30px">0<small> ${p.unit || ""}</small></div></div>`); [...g.children].forEach((c, i) => bin(c, t + 0.3 + i * 0.15));
            const num = g.querySelector(".big").firstChild, o = {}; let v = 0; Object.defineProperty(o, "n", { get: () => v, set: (x) => { v = x; num.nodeValue = String(Math.round(x)); } });
            tl.fromTo(o, { n: 0 }, { n: p.n, duration: 2, ease: "power2.out" }, t + (p.at ?? 0.8)); sfx(t + (p.at ?? 0.8), "montee", 0.2); sfx(t + (p.at ?? 0.8) + 2, "impact", 0.26);
            chipsR(g, p.chips, t); return g;
          },
          verse: (box, p, t) => { const g = mk(box, `<div><div class="kick">${p.kick}</div><div class="verse">${p.html}</div></div>`); [...g.children].forEach((c, i) => bin(c, t + 0.3 + i * 0.15)); const b = g.querySelector("b"); if (b) tl.fromTo(b, { "--hl": "0%" }, { "--hl": "100%", duration: 1.4, ease: "power2.inOut" }, t + (p.hl ?? 2)); sfx(t + 0.3, "page", 0.35); return g; },
          chips: (box, p, t) => { const g = mk(box, `<div><div class="kick">${p.kick || ""}</div><div class="ttl">${p.title}</div></div>`); [...g.children].forEach((c, i) => bin(c, t + 0.3 + i * 0.15)); chipsR(g, p.chips, t); return g; },
          quote: (box, p, t) => { const g = mk(box, `<div><div style="font:800 200px/0.6 Montserrat;color:#23bded">“</div><div class="ttl" style="font-size:64px;margin-top:10px">${p.text}</div><div class="kick" style="margin-top:30px">${p.by || "APÔTRE PARIS TALLA"}</div></div>`); [...g.children].forEach((c, i) => bin(c, t + 0.3 + i * 0.2)); return g; },
        };
        function chipsR(g, list, t) { if (!list) return; const c = mk(g, `<div style="margin-top:44px"></div>`); list.forEach(([txt, at, k]) => { const x = mk(c, `<span class="chip ${k || ""}">${txt}</span>`); bin(x, t + at, { s: 0.8, y: 20, e: "back.out(1.8)" }); sfx(t + at, "whoosh_court", 0.18); }); }
        const N = EP.SCENES.length, SEGS = EP.SCENES.map((_, k) => 3.6 + k * 15);
        EP.SCENES.forEach((sc, k) => {
          const a = SEGS[k], b = k + 1 < N ? SEGS[k + 1] : EP.DUR;
          const el = mk(P, `<div class="scn"></div>`);
          mk(el, `<div class="sec">${EP.SCENES.map((_, j) => `<i class="${j === k ? "on" : ""}" style="width:${Math.max(14, Math.min(46, 660 / N - 10))}px"></i>`).join("")}</div>`);
          tl.fromTo(el, { opacity: 0, scale: 1.04, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, a);
          if (k + 1 < N) tl.to(el, { opacity: 0, scale: 0.97, filter: "blur(18px)", duration: 0.45, ease: "power2.in" }, b - 0.45);
          sfx(a - 0.2, "whoosh", 0.28);
          sc.forEach((p, i) => {
            const t = a + (p.at || 0), box = mk(el, `<div style="position:absolute;inset:0;padding:120px 64px"></div>`);
            const g = R[p.type](box, p, t);
            const nx = sc[i + 1]; if (nx) { tl.to(box, { opacity: 0, y: -30, filter: "blur(12px)", duration: 0.4 }, a + nx.at - 0.45); sfx(a + nx.at, "whoosh_court", 0.2); }
          });
        });
        // Paroles mot à mot
        const LY = $("#lyrics"), KEY = /^(promesse|Dieu|foi|Bible|bien-aimés?|espérance|postérité|Romains)/i;
        window.CAPS.forEach(([a, b, txt]) => {
          const words = txt.split(" ");
          const el = mk(LY, `<div class="ly">${words.map((w) => `<span class="w${KEY.test(w.replace(/^[«(—]+/, "")) ? " k" : ""}">${w}</span>`).join(" ")}</div>`);
          tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, a - 0.05);
          tl.to(el, { opacity: 0, y: -10, duration: 0.18 }, Math.max(a + 0.3, b - 0.05));
          const L = words.reduce((s, w) => s + w.length + 1, 0); let cur = a;
          el.querySelectorAll(".w").forEach((w, i) => { tl.set(w, { color: w.classList.contains("k") ? "#7fdcff" : "#ffffff" }, cur); cur += (b - a) * (words[i].length + 1) / L * 0.92; });
        });
        tl.fromTo(".lyr-tag", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.6);
        window.__epSFX = SFX;
        window.__timelines["main"] = tl;
      })();
    </script>
